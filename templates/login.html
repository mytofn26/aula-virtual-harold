<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula Virtual — Harold Parco</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="center-shell">
    <div class="card">
      <span class="brand-name">Harold Parco</span>
      <span class="brand-sub">AULA VIRTUAL</span>

      {% with messages = get_flashed_messages(category_filter=["login"]) %}
        {% if messages %}
          {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <label>Tu correo</label>
        <input type="email" name="email" required placeholder="tucorreo@ejemplo.com">
        <label>Código de acceso</label>
        <input type="text" name="code" required placeholder="Ej: A1B2C3D4">
        <button class="btn" type="submit">Entrar al curso</button>
      </form>
      <p style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:20px;">
        ¿No tienes tu código? <a href="/suscribirme" style="color:var(--wine);font-weight:600;text-decoration:underline;">Suscríbete aquí</a>.
      </p>
    </div>
  </div>
</body>
</html>
